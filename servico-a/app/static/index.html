<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos - Serviços de Nuvem</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --txt:#1d2330; --sub:#5b6475; --pri:#2563eb; --ok:#15803d; --err:#b91c1c; --borda:#dde1e8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { color: var(--sub); margin: 0 0 24px; }
  section { background: var(--card); border:1px solid var(--borda); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  label { display:block; font-size:.85rem; color:var(--sub); margin-bottom:4px; }
  input, select { width:100%; padding:8px 10px; border:1px solid var(--borda); border-radius:6px; font-size:.95rem; }
  .linha { display:grid; grid-template-columns: 2fr 1fr; gap:10px; margin-bottom:10px; }
  button { background:var(--pri); color:#fff; border:0; border-radius:6px; padding:9px 16px; font-size:.95rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .stats { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
  .stat { border:1px solid var(--borda); border-radius:8px; padding:12px; }
  .stat b { display:block; font-size:1.6rem; }
  .stat span { color:var(--sub); font-size:.85rem; }
  pre { background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px; overflow:auto; font-size:.8rem; max-height:260px; margin:0; }
  .msg-ok { color:var(--ok); } .msg-err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Sistema de Pedidos</h1>
  <p class="sub">Cliente &rarr; NGINX &rarr; Serviço A &rarr; RabbitMQ &rarr; Serviço B</p>

  <section>
    <h2>Novo pedido</h2>
    <form id="form-pedido">
      <div class="linha">
        <div><label for="cliente">Cliente</label><input id="cliente" value="guilherme" required></div>
        <div><label for="qtd">Quantidade</label><input id="qtd" type="number" min="1" max="100" value="1" required></div>
      </div>
      <div class="linha">
        <div><label for="produto">Produto</label>
          <select id="produto"><option>camiseta</option><option>caneca</option><option>mochila</option><option>boné</option></select>
        </div>
        <div style="align-self:end"><button type="submit">Enviar pedido</button></div>
      </div>
    </form>
  </section>

  <section>
    <h2>Gerar carga (lote)</h2>
    <div class="linha">
      <div><label for="lote">Quantidade de pedidos</label><input id="lote" type="number" min="1" max="5000" value="500"></div>
      <div style="align-self:end"><button id="btn-lote" type="button">Gerar lote</button></div>
    </div>
  </section>

  <section>
    <h2>Fila no RabbitMQ <small style="color:var(--sub);font-weight:normal">(atualiza a cada 2s)</small></h2>
    <div class="stats">
      <div class="stat"><b id="aguardando">-</b><span>mensagens aguardando</span></div>
      <div class="stat"><b id="consumidores">-</b><span>consumidores (réplicas do Serviço B)</span></div>
    </div>
  </section>

  <section>
    <h2>Última resposta</h2>
    <pre id="saida">-</pre>
  </section>
</main>
<script>
  const saida = document.getElementById('saida');
  function mostrar(obj, ok) { saida.textContent = JSON.stringify(obj, null, 2); saida.className = ok ? 'msg-ok' : 'msg-err'; }

  async function post(url, corpo) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    const dados = await r.json().catch(() => ({ erro: r.statusText }));
    mostrar(dados, r.ok);
  }

  document.getElementById('form-pedido').addEventListener('submit', (e) => {
    e.preventDefault();
    post('/api/pedidos', {
      cliente: document.getElementById('cliente').value,
      itens: [{ produto: document.getElementById('produto').value, quantidade: Number(document.getElementById('qtd').value) }]
    });
  });

  document.getElementById('btn-lote').addEventListener('click', async (e) => {
    e.target.disabled = true;
    try { await post('/api/pedidos/lote', { quantidade: Number(document.getElementById('lote').value) }); }
    finally { e.target.disabled = false; }
  });

  async function atualizarFila() {
    try {
      const r = await fetch('/api/fila');
      if (!r.ok) throw new Error();
      const d = await r.json();
      document.getElementById('aguardando').textContent = d.mensagens_aguardando;
      document.getElementById('consumidores').textContent = d.consumidores;
    } catch { document.getElementById('aguardando').textContent = '?'; }
  }
  atualizarFila(); setInterval(atualizarFila, 2000);
</script>
</body>
</html>
