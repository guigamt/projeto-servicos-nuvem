# Etapa 3 - HPA do servico B
# aplicar so na etapa 3: kubectl apply -f k8s/hpa/servico-b-hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: servico-b
  namespace: pedidos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: servico-b
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50   # se a media passar de 50% do request, sobe mais pods
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # espera 1 min sem carga antes de comecar a descer
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30           # tira 1 pod a cada 30s (desce aos poucos)
