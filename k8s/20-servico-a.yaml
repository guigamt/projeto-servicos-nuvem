# Servico A (produtor) - Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servico-a
  namespace: pedidos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: servico-a
  template:
    metadata:
      labels:
        app: servico-a
    spec:
      containers:
        - name: servico-a
          image: pedidos/servico-a:1.0
          imagePullPolicy: IfNotPresent   # imagem buildada local e carregada no minikube
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: pedidos-config
            - secretRef:
                name: rabbitmq-credenciais
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
---
# Service ClusterIP: so acessivel dentro do cluster. Quem expoe pra fora e o Ingress
apiVersion: v1
kind: Service
metadata:
  name: servico-a
  namespace: pedidos
spec:
  selector:
    app: servico-a
  ports:
    - port: 5000
