# RabbitMQ tem estado (as mensagens), entao usamos StatefulSet com um volume (PVC)
# so 1 replica, explicamos a limitacao na documentacao
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: pedidos
spec:
  selector:
    app: rabbitmq
  ports:
    - port: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: pedidos
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      securityContext:
        fsGroup: 999   # usuario do rabbitmq dentro da imagem, pra conseguir escrever no volume
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1
          ports:
            - containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciais
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credenciais
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: dados
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
