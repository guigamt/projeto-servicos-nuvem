# Ingress - ponto de entrada (NGINX Ingress Controller), manda tudo pro servico A
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pedidos
  namespace: pedidos
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: servico-a
                port:
                  number: 5000
