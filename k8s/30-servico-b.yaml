# Servico B (consumidor) - so Deployment, nao tem Service
# porque ninguem precisa acessar ele, ele que conecta no rabbitmq
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servico-b
  namespace: pedidos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: servico-b
  template:
    metadata:
      labels:
        app: servico-b
    spec:
      containers:
        - name: servico-b
          image: pedidos/servico-b:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pedidos-config
            - secretRef:
                name: rabbitmq-credenciais
          resources:
            requests:
              cpu: 100m   # o HPA calcula a % de CPU em cima desse valor
            limits:
              cpu: 500m
