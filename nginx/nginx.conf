# NGINX - unico ponto de entrada da aplicacao (reverse proxy)
events {}

http {
    # log com o request_id, pra conseguir seguir o pedido ate o servico B
    log_format com_id '$remote_addr "$request" status=$status request_id=$request_id';
    access_log /dev/stdout com_id;

    server {
        listen 80;

        location / {
            # manda tudo pro servico A pela rede interna do docker
            proxy_pass http://servico-a:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # id gerado pelo proprio nginx para cada requisicao
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
