# NGINX como reverse proxy - unico ponto de entrada da aplicacao (etapa 1)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # $request_id e gerado pelo proprio NGINX e repassado para o Servico A.
    # Com ele da pra seguir a mesma operacao nos logs de todos os componentes.
    log_format rastreio '$remote_addr [$time_local] "$request" status=$status '
                        'tempo=${request_time}s upstream=$upstream_addr request_id=$request_id';
    access_log /dev/stdout rastreio;
    error_log  /dev/stderr warn;

    # DNS interno do Docker. valid=10s faz o NGINX reconsultar o nome do servico,
    # entao se o container do Servico A for recriado (ou escalado) ele acha o IP novo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            set $servico_a http://servico-a:8000;
            proxy_pass $servico_a;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;

            add_header X-Request-ID $request_id always;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }
    }
}
