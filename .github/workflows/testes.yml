name: testes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # usado so para salvar os logs no branch ci-logs

jobs:
  etapa1-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sobe a aplicacao e testa o fluxo + falha controlada
        run: |
          set -o pipefail
          bash scripts/teste-compose.sh 2>&1 | tee etapa1.log
      - name: Salva log no branch ci-logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-salvar-log.sh etapa1.log

  etapas2e3-kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          cpus: max
          memory: 6000m
      - name: Implanta no Kubernetes e testa self-healing, escala e HPA
        run: |
          set -o pipefail
          bash scripts/teste-k8s.sh 2>&1 | tee etapas2e3.log
      - name: Diagnostico em caso de falha
        if: failure()
        run: |
          {
            echo "===== get all"; kubectl get all -A
            echo "===== eventos"; kubectl get events -A --sort-by=.lastTimestamp | tail -60
            echo "===== describe pedidos"; kubectl -n pedidos describe pods | tail -120
            echo "===== logs ingress"; kubectl -n ingress-nginx logs -l app.kubernetes.io/component=controller --tail=40
          } >> etapas2e3.log 2>&1 || true
      - name: Salva log no branch ci-logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-salvar-log.sh etapas2e3.log
