# Etapa 1 - Docker Compose
# antes de subir: cp .env.example .env (e troca a senha)
# subir: docker compose up -d --build

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"   # unica porta aberta pro cliente
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - externa
      - interna
    depends_on:
      - servico-a

  servico-a:
    build: ./servico-a
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks:
      - interna
    depends_on:
      rabbitmq:
        condition: service_healthy

  servico-b:
    build: ./servico-b
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      TEMPO_PROCESSAMENTO: 1
    networks:
      - interna
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.1
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - dados-rabbitmq:/var/lib/rabbitmq   # guarda as mensagens mesmo se o container reiniciar
    networks:
      - interna
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

networks:
  externa:
  interna:
    internal: true   # rede interna, sem acesso de fora

volumes:
  dados-rabbitmq:
